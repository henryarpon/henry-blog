@if (note$ | async; as note) {
  <article>
    <h1>{{ note.title }}</h1>
    <div class="meta"><time [attr.datetime]="note.date">{{ note.date | date:'longDate' }}</time></div>
    <hr />
    <markdown [data]="note.body"></markdown>
  </article>
} @else {
  <p class="empty">Note not found.</p>
}
