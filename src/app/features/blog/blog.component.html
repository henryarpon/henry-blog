<section aria-labelledby="blog-heading">
  <h1 id="blog-heading">Blog</h1>
  <ul class="list-rows">
    @for (post of posts$ | async; track post.slug) {
      <li class="row">
        <div class="meta">
          <time [attr.datetime]="post.date">{{ post.date | date:'mediumDate' }}</time>
          <span class="category">{{ categoryLabel }}</span>
        </div>
        <div class="content">
          <a [routerLink]="['/blog', post.slug]" class="title">{{ post.title }}</a>
          <p class="summary">{{ post.summary }}</p>
        </div>
      </li>
    }
  </ul>
  @if ((posts$ | async)?.length === 0) {
    <div class="empty">No posts yet — published posts will appear here.</div>
  }
</section>
